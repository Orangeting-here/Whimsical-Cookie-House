<!doctype html>
<!-- ============================================================
     杂物柜 · 单文件导航页。
     版式与交互沿用原稿；条目内容不再内嵌，改为指向 GitHub 上的
     文件与页面（打开走 Pages 在线地址，拿走走 raw 原始文件）。
     要换链接，只改页面底部 script 里的 SITE / RAW 与 APPS 的 path。
     页面本身不请求任何第三方地址，只有你点开条目时才会联网。
     ============================================================ -->
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>杂物柜 · 自己攒的小东西</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E1714'/%3E%3Crect x='7' y='10' width='18' height='12' rx='3' fill='none' stroke='%23C9A87C' stroke-width='1.3'/%3E%3Cline x1='7' y1='16' x2='25' y2='16' stroke='%23C9A87C' stroke-width='1.3'/%3E%3C/svg%3E">
<style>/* ============================================================
   深色木 · 香槟金
   dark  近黑褐木底，低饱和，香槟金做唯一点缀
   light 象牙灰木底，深香槟，收敛而不寡淡
   ============================================================ */
:root{
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", sans-serif;
  --font-serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --bg:#1E1714;
  --surface:#28211C;
  --surface-hi:#312922;
  --wood-1:rgba(0,0,0,.14);
  --wood-2:rgba(214,178,138,.026);
  --wood-3:rgba(176,136,96,.033);
  --line:rgba(232,214,190,.11);
  --line-strong:rgba(232,214,190,.22);
  --text:#EDE4D7;
  --heading:#F3E9D9;
  --text-soft:#B3A495;
  --muted:#877868;
  --accent:#C9A87C;
  --accent-soft:rgba(201,168,124,.10);
  --accent-line:rgba(201,168,124,.32);
  --herb:#8A9B84;

  --polish:rgba(214,178,138,.055);
  --card-sheen:rgba(214,178,138,.045);
  --glow-a:rgba(186,142,96,.15);
  --glow-b:rgba(138,155,132,.05);
  --vignette:rgba(10,6,3,.44);

  --glass-bg1:rgba(255,248,240,.105);
  --glass-bg2:rgba(255,248,240,.035);
  --glass-line:rgba(255,246,235,.18);
  --glass-inset:rgba(255,250,240,.26);
  --glass-ink:#EFE6D9;
  --glass-shadow:0 8px 24px rgba(12,6,2,.30);
  --shadow:0 2px 10px rgba(12,6,2,.20), 0 10px 26px rgba(12,6,2,.16);
  --shadow-lift:0 4px 14px rgba(12,6,2,.26), 0 22px 52px rgba(12,6,2,.36);
  --peek-bg:rgba(30,23,20,.55);
  --foot-bg:rgba(33,25,21,.5);
}
html[data-theme="light"]{
  --bg:#E7E1D6;
  --surface:#F5F0E7;
  --surface-hi:#FBF7F0;
  --wood-1:rgba(96,74,48,.075);
  --wood-2:rgba(255,255,255,.09);
  --wood-3:rgba(150,110,70,.04);
  --line:rgba(74,56,34,.15);
  --line-strong:rgba(74,56,34,.26);
  --text:#2A231A;
  --heading:#2C2419;
  --text-soft:#5E5447;
  --muted:#8A7E70;
  --accent:#8A6A44;
  --accent-soft:rgba(138,106,68,.08);
  --accent-line:rgba(138,106,68,.26);
  --herb:#5C7159;

  --polish:rgba(255,255,255,.30);
  --card-sheen:rgba(255,255,255,.16);
  --glow-a:rgba(214,176,130,.22);
  --glow-b:rgba(138,155,132,.10);
  --vignette:rgba(92,72,46,.10);

  --glass-bg1:rgba(255,253,249,.62);
  --glass-bg2:rgba(255,250,242,.32);
  --glass-line:rgba(255,255,255,.74);
  --glass-inset:rgba(255,255,255,.95);
  --glass-ink:#2A231A;
  --glass-shadow:0 8px 22px rgba(74,56,34,.14);
  --shadow:0 1px 3px rgba(74,56,34,.06), 0 8px 22px rgba(74,56,34,.10);
  --shadow-lift:0 2px 6px rgba(74,56,34,.08), 0 20px 44px rgba(74,56,34,.16);
  --peek-bg:rgba(252,249,243,.6);
  --foot-bg:rgba(252,249,243,.55);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--font-sans);
  font-size:15px;
  line-height:1.75;
  color:var(--text);
  background-color:var(--bg);
  background-image:
    radial-gradient(1240px 620px at 16% -18%, var(--glow-a), transparent 62%),
    radial-gradient(880px 500px at 86% -2%, var(--glow-b), transparent 66%),
    linear-gradient(180deg, var(--polish), transparent 42%),
    radial-gradient(150% 95% at 50% 120%, var(--vignette), transparent 62%),
    repeating-linear-gradient(103deg, var(--wood-1) 0 1px, transparent 1px 17px),
    repeating-linear-gradient(74deg, var(--wood-2) 0 1px, transparent 1px 43px),
    repeating-linear-gradient(97deg, var(--wood-3) 0 2px, transparent 2px 101px);
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,repeat,repeat,repeat;
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 头部 ---------- */
header{padding:52px 24px 0}
.head-in{
  max-width:1000px;margin:0 auto;
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:22px;flex-wrap:wrap;
}
.title-block{min-width:0;flex:1 1 260px}
h1{
  margin:0;
  font-family:var(--font-serif);
  font-size:30px;font-weight:500;line-height:1.32;
  letter-spacing:.14em;
  color:var(--heading);
}
.sub{
  margin:12px 0 0;
  font-size:13.5px;line-height:1.9;color:var(--text-soft);
  max-width:42ch;
  letter-spacing:.02em;
}
.tools{display:flex;align-items:center;gap:10px;flex:0 0 auto;padding-top:6px}

/* 玻璃：搜索 */
.search{
  display:flex;align-items:center;gap:8px;
  height:42px;padding:0 15px;
  border-radius:999px;
  border:1px solid var(--glass-line);
  background-image:linear-gradient(180deg,var(--glass-bg1),var(--glass-bg2));
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  backdrop-filter:blur(22px) saturate(150%);
  box-shadow:inset 0 1px 0 var(--glass-inset), var(--glass-shadow);
  transition:border-color .24s,box-shadow .24s;
}
.search:focus-within{border-color:var(--accent-line);box-shadow:inset 0 1px 0 var(--glass-inset),var(--shadow-lift)}
.search svg{flex:0 0 auto;width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.6}
.search input{
  border:0;background:transparent;color:var(--text);
  font-family:var(--font-sans);font-size:15px;
  width:130px;padding:0;outline:none;line-height:42px;
}
.search input::placeholder{color:var(--muted);font-size:13px}

/* 玻璃：圆形图标钮 */
.icon-btn{
  background-color:transparent;
  width:42px;height:42px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:999px;
  border:1px solid var(--glass-line);
  background-image:linear-gradient(180deg,var(--glass-bg1),var(--glass-bg2));
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  backdrop-filter:blur(22px) saturate(150%);
  box-shadow:inset 0 1px 0 var(--glass-inset), var(--glass-shadow);
  color:var(--glass-ink);cursor:pointer;
  transition:transform .24s,border-color .24s,color .24s;
}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
.icon-btn:hover{color:var(--accent);border-color:var(--accent-line);transform:translateY(-1px)}
.icon-btn:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}

/* ---------- 主体 ---------- */
main{max-width:1000px;margin:0 auto;padding:0 24px 60px}

/* 玻璃：筛选 */
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:36px 0 0}
.chip{
  background-color:transparent;
  font-family:var(--font-sans);font-size:13px;
  min-height:36px;padding:6px 16px;
  border-radius:999px;
  border:1px solid var(--glass-line);
  background-image:linear-gradient(180deg,var(--glass-bg1),var(--glass-bg2));
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  backdrop-filter:blur(16px) saturate(140%);
  box-shadow:inset 0 1px 0 var(--glass-inset), 0 4px 12px rgba(12,6,2,.10);
  color:var(--glass-ink);
  letter-spacing:.04em;
  cursor:pointer;
  transition:color .24s,border-color .24s,transform .24s;
}
.chip:hover{color:var(--accent);border-color:var(--accent-line);transform:translateY(-1px)}
.chip[aria-pressed="true"]{
  color:#FFF7EC;
  border-color:rgba(255,238,214,.42);
  background-image:linear-gradient(180deg, rgba(201,168,124,.56), rgba(140,106,63,.42));
  box-shadow:inset 0 1px 0 rgba(255,240,218,.34), 0 8px 22px rgba(80,50,20,.26);
}
html[data-theme="light"] .chip[aria-pressed="true"]{
  color:#FFFBF4;
  background-image:linear-gradient(180deg, rgba(140,104,66,.90), rgba(96,68,38,.84));
  border-color:rgba(255,255,255,.5);
}
.chip:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}
.chip .n{font-size:11.5px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .n{color:rgba(255,247,236,.8)}

.grid{margin-top:28px;display:grid;grid-template-columns:1fr;gap:18px}
.card[hidden]{display:none !important}
@media (min-width:600px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media (min-width:940px){ .grid{grid-template-columns:repeat(3,1fr)} }

/* 木面卡片 */
.card{
  position:relative;
  display:flex;flex-direction:column;
  border-radius:20px;
  padding:22px 22px 18px;
  min-width:0;
  min-height:322px;
  background-color:var(--surface);
  background-image:
    repeating-linear-gradient(103deg, var(--wood-1) 0 1px, transparent 1px 15px),
    repeating-linear-gradient(76deg, var(--wood-2) 0 1px, transparent 1px 33px),
    linear-gradient(180deg, var(--card-sheen), transparent 46%);
  border:1px solid var(--line);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,236,212,.08);
  transition:transform .32s cubic-bezier(.2,.7,.3,1),box-shadow .32s,border-color .32s;
}
.card:hover,.card:focus-within{
  transform:translateY(-4px);
  box-shadow:var(--shadow-lift), inset 0 1px 0 rgba(255,240,220,.14);
  border-color:var(--line-strong);
}

.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* 玻璃：小字牌 */
.glyph{
  width:34px;height:34px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--font-serif);font-size:16px;line-height:1;
  color:var(--accent);
  border-radius:11px;
  border:1px solid var(--glass-line);
  background-image:linear-gradient(180deg,var(--glass-bg1),var(--glass-bg2));
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  backdrop-filter:blur(14px) saturate(140%);
  box-shadow:inset 0 1px 0 var(--glass-inset);
}
.kind{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--muted);letter-spacing:.08em;
}
.kd{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.5;flex:0 0 auto}
.kind.html .kd{background:var(--accent);opacity:.95}
.kind.json .kd{background:var(--herb);opacity:.95}

.card-name{
  margin:16px 0 0;
  font-family:var(--font-serif);
  font-size:17.5px;font-weight:600;line-height:1.5;letter-spacing:.03em;
  color:var(--heading);
  overflow-wrap:anywhere;
}
.card-desc{
  margin:8px 0 0;
  font-size:13.5px;line-height:1.85;color:var(--text-soft);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;
}
.meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.m{
  font-size:11px;color:var(--muted);
  background:var(--accent-soft);
  padding:2px 10px;border-radius:999px;
  letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
}
.m.plain{background:transparent;padding:2px 0}

.card-foot{
  position:relative; z-index:5;
  margin:18px -22px -18px; padding:15px 22px 18px;
  border-top:1px solid var(--line);
  border-radius:0 0 19px 19px;
  background:var(--foot-bg);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  backdrop-filter:blur(26px) saturate(160%);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.tags{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.tag{
  font-size:11px;color:var(--muted);
  border:1px solid var(--line);
  padding:1px 9px;border-radius:999px;
  letter-spacing:.04em;
  white-space:nowrap;
}

/* 玻璃：操作按钮（苹果同款） */
.btn-group{display:flex;gap:6px;flex:1 1 auto;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.btn-group .btn{padding:7px 12px;font-size:12.5px}
.btn{
  background-color:transparent;
  position:relative;
  font-family:var(--font-sans);font-size:13px;
  min-height:37px;padding:7px 16px;
  border-radius:999px;
  border:1px solid var(--glass-line);
  background-image:linear-gradient(180deg,var(--glass-bg1),var(--glass-bg2));
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  backdrop-filter:blur(22px) saturate(160%);
  box-shadow:inset 0 1px 0 var(--glass-inset), 0 6px 18px rgba(12,6,2,.16);
  color:var(--glass-ink);
  letter-spacing:.04em;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:transform .24s,border-color .24s,box-shadow .24s,color .24s;
}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6}
.btn:hover{
  transform:translateY(-1px);
  border-color:var(--accent-line);
  box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow-lift);
}
.btn:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}
.btn-primary{
  color:#FFF7EC;
  border-color:rgba(255,238,214,.44);
  background-image:linear-gradient(180deg, rgba(201,168,124,.58), rgba(140,106,63,.44));
  box-shadow:inset 0 1px 0 rgba(255,242,222,.36), 0 8px 22px rgba(80,50,20,.28);
}
html[data-theme="light"] .btn-primary{
  color:#FFFBF4;
  border-color:rgba(255,255,255,.52);
  background-image:linear-gradient(180deg, rgba(140,104,66,.90), rgba(94,66,36,.84));
  box-shadow:inset 0 1px 0 rgba(255,246,232,.45), 0 8px 20px rgba(80,56,30,.22);
}
.btn-primary:hover{color:#FFFBF4;border-color:rgba(255,242,222,.6)}
.btn[aria-disabled="true"]{opacity:.58}
.btn[aria-disabled="true"]:hover{transform:none;border-color:var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-inset), 0 6px 18px rgba(12,6,2,.16)}

/* 空态 */
.empty{
  margin-top:48px;padding:56px 24px;text-align:center;
  border:1px dashed var(--line-strong);border-radius:20px;
}
.empty p{margin:0;font-size:14px;color:var(--text-soft)}
.empty span{display:block;margin-top:8px;font-size:12px;color:var(--muted)}

/* 页脚 */
.foot{
  max-width:1000px;margin:0 auto;padding:0 24px 50px;
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-size:11.5px;color:var(--muted);letter-spacing:.05em;
}

/* toast 也用玻璃 */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);
  border-radius:16px;
  border:1px solid var(--glass-line);
  background-image:linear-gradient(180deg,var(--glass-bg1),var(--glass-bg2));
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  backdrop-filter:blur(26px) saturate(160%);
  box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow-lift);
  color:var(--glass-ink);
  font-size:13px;line-height:1.6;
  letter-spacing:.03em;
  padding:12px 18px;max-width:min(88vw,440px);
  opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;
  z-index:40;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:420px){
  header{padding:38px 18px 0}
  main{padding:0 18px 48px}
  h1{font-size:26px;letter-spacing:.12em}
  .tools{width:100%}
  .search{flex:1 1 auto}
  .search input{width:100%}
  .foot{padding:0 18px 38px}
}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001s !important}
  .card:hover,.card:focus-within{transform:none}
}

/* ---------- 悬停预览 ---------- */
.peek{
  position:absolute; left:-1px; right:-1px; top:-1px; bottom:66px;
  display:flex; flex-direction:column; gap:10px;
  padding:12px;
  border-radius:20px 20px 14px 14px;
  background:var(--peek-bg);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  backdrop-filter:blur(26px) saturate(150%);
  border-bottom:1px solid var(--line);
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:opacity .26s ease, transform .3s cubic-bezier(.2,.7,.3,1);
  z-index:3;
}
.card.on .peek{opacity:1;transform:translateY(0)}
.card.on{
  transform:translateY(-4px);
  box-shadow:var(--shadow-lift), inset 0 1px 0 rgba(255,240,220,.14);
  border-color:var(--line-strong);
}

.peek-frame{
  position:relative; flex:1 1 auto; min-height:0;
  border-radius:12px; overflow:hidden;
  background:rgba(0,0,0,.26);
  border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
}
html[data-theme="light"] .peek-frame{background:rgba(255,255,255,.55)}

.peek-frame iframe{
  position:absolute; top:0; left:0;
  width:400%; height:400%;
  transform:scale(.25); transform-origin:0 0;
  border:0; pointer-events:none;
  opacity:0; transition:opacity .32s ease;
}
.peek-frame.ready iframe{opacity:1}

.peek-sk{
  font-family:var(--font-mono);
  font-size:11px; color:var(--muted); letter-spacing:.12em;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.95}}
.peek-frame.ready .peek-sk{display:none}

.peek-frame.plain{flex-direction:column; gap:7px}
.peek-mark{font-family:var(--font-serif); font-size:26px; line-height:1; color:var(--accent); opacity:.8}
.peek-tip{font-size:10.5px; color:var(--muted); letter-spacing:.1em}

.peek-info{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  padding:0 2px;
}
.peek-name{
  font-family:var(--font-serif); font-size:15px; line-height:1.4;
  color:var(--heading); letter-spacing:.03em;
  min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.peek-hint{font-size:10px; color:var(--muted); letter-spacing:.12em; flex:0 0 auto; white-space:nowrap}

/* 说明文档预览：专门打磨的轻透排版（只显示开头，不滚动） */
.md-doc.peek-doc{
  flex:none; width:100%; height:100%;
  min-height:0; max-height:none;
  overflow:hidden; padding:12px 14px;
  font-family:var(--font-sans);
  font-size:11px; line-height:1.62;
  color:var(--text-soft);
}
.md-doc.peek-doc .md-h{
  font-family:var(--font-serif); font-weight:600;
  line-height:1.4; margin:0 0 8px;
}
.md-doc.peek-doc .md-h1{font-size:13.5px;color:var(--accent);margin-top:0}
.md-doc.peek-doc .md-h2{font-size:12.5px;color:var(--heading);margin:10px 0 6px}
.md-doc.peek-doc .md-h3{font-size:11.5px;color:var(--heading);margin:8px 0 5px}
.md-doc.peek-doc .md-p{margin:6px 0}
.md-doc.peek-doc strong{color:var(--accent);font-weight:600}
.md-doc.peek-doc code{
  font-family:var(--font-mono);font-size:10px;
  background:var(--accent-soft);color:var(--accent);
  padding:1px 5px;border-radius:5px;
}
/* 引用块在小预览里弱化：去掉重底，只留细金边框，退到后面 */
.md-doc.peek-doc .md-quote{
  margin:7px 0; padding:4px 11px;
  border-left:2px solid var(--accent-line);
  background:transparent; border-radius:0 8px 8px 0;
  color:var(--text-soft);
}

/* ---------- base64 / 编码 ---------- */
function b64ToBytes(b64){
  const bin = atob(b64);
  const len = bin.length;
  const out = new Uint8Array(len);
  for (let i = 0; i < len; i++) out[i] = bin.charCodeAt(i) & 0xff;
  return out;
}
function mimeOf(app){
  if (app.kind === 'html') return 'text/html;charset=utf-8';
  if (app.kind === 'json') return 'application/json;charset=utf-8';
  if (app.kind === 'apk') return 'application/vnd.android.package-archive';
  if (app.kind === 'js') return 'text/javascript;charset=utf-8';
  if (app.kind === 'jar') return 'application/java-archive';
  return 'application/octet-stream';
}
function makeBlob(app){
  return new Blob([b64ToBytes(payloadOf(app.id))], { type: mimeOf(app) });
}
/* UTF-8 字节转文本：TextDecoder 快路径，旧环境手动解码兜底 */
function bytesToText(bytes){
  if (window.TextDecoder) return new TextDecoder('utf-8').decode(bytes);
  let s = '';
  let i = 0;
  while (i < bytes.length) {
    const c = bytes[i++];
    if (c < 0x80) {
      s += String.fromCharCode(c);
    } else if (c < 0xE0) {
      s += String.fromCharCode(((c & 31) << 6) | (bytes[i++] & 63));
    } else if (c < 0xF0) {
      s += String.fromCharCode(((c & 15) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63));
    } else {
      const u = ((c & 7) << 18) | ((bytes[i++] & 63) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63);
      const v = u - 0x10000;
      s += String.fromCharCode(0xD800 + (v >> 10), 0xDC00 + (v & 0x3FF));
    }
  }
  return s;
}

      if (!w) { toast('弹窗被拦了，再点一次。'); }
      return;
    }
    toast(app.kind === 'apk' ? '这个不能在这儿打开，拿走装。' : '这个打不开，拿走下。');
    return;
  }
  if (!payloadOf(app.id)) { toast('还没放进来。'); return; }
  if (app.kind === 'apk' || app.kind === 'jar') { toast('这个不能在这儿打开，拿走装。'); return; }
  if (app.kind === 'js') { openLock(app); return; }
  if (app.kind !== 'html') { toast('这个打不开，拿走看。'); return; }
  if (openMode === 'inline') { openInPage(app); return; }
  const url = URL.createObjectURL(makeBlob(app));
  const win = window.open(url, '_blank', 'noopener');
  if (!win) { URL.revokeObjectURL(url); openInPage(app); return; }
  setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
}

function openExternal(url){
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

function downloadFile(item){
  const url = item.rawUrl || item.href;
  if (!url) { toast('还没放上去。'); return; }
  /* 先抓成 blob 实现真正的“下载”；GitHub raw 支持跨域，
     若不支持（例如用本地文件方式打开），退化为打开链接。 */
  fetch(url, { cache: 'no-store' }).then(function(r){
    if (!r.ok) throw new Error('bad');
    return r.blob();
  }).then(function(blob){
    const o = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = o;
    a.download = item.fileName || item.name || 'download';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(o); }, 3000);
    toast('在下了。');
  }).catch(function(){
    openExternal(url);
    toast('已打开原文件，右键另存即可。');
  });
}

function downloadApp(app){ downloadFile(app); }

function match(a, q){
  if (!q) return true;
  return (a.name + ' ' + a.desc + ' ' + (a.tags || []).join(' ') + ' ' + (a.fileName || '')).toLowerCase().indexOf(q) > -1;
}
function appVisible(a){
  if (state.kind !== 'all' && a.kind !== state.kind) return false;
  return match(a, state.q.trim().toLowerCase());
}

const ICON_OPEN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M19 15v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4"/></svg>';
const ICON_DL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>';
const ICON_DOC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>';

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* 行内标记：先转义，再替换加粗与行内代码（内容已转义，安全） */
function mdInline(s){
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  return s;
}

/* 极简 Markdown 渲染：标题、列表、表格、引用、代码块、分隔线、段落 */
function renderMarkdown(text){
  const lines = String(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  let html = '';
  let i = 0;
  let inCode = false, codeBuf = [];
  let listType = null;
  function closeList(){
    if (listType){ html += listType === 'ul' ? '</ul>' : '</ol>'; listType = null; }
  }
  while (i < lines.length){
    const line = lines[i];
    const t = line.trim();

    if (t.indexOf('```') === 0){
      if (!inCode){ closeList(); inCode = true; codeBuf = []; }
      else { html += '<pre class="md-code">' + esc(codeBuf.join('\n')) + '</pre>'; inCode = false; }
      i++; continue;
    }
    if (inCode){ codeBuf.push(line); i++; continue; }

    if (t.charAt(0) === '|' && t.charAt(t.length-1) === '|' &&
        i + 1 < lines.length && lines[i+1].indexOf('-') > -1 &&
        /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
      closeList();
      const head = t.replace(/^\||\|$/g, '').split('|').map(function(c){ return c.trim(); });
      i += 2;
      const rows = [];
      while (i < lines.length){
        const rt = lines[i].trim();
        if (rt.charAt(0) !== '|' || rt.charAt(rt.length-1) !== '|') break;
        rows.push(rt.replace(/^\||\|$/g, '').split('|').map(function(c){ return c.trim(); }));
        i++;
      }
      html += '<table class="md-table"><thead><tr>' +
        head.map(function(h){ return '<th>' + mdInline(h) + '</th>'; }).join('') +
        '</tr></thead><tbody>';
      rows.forEach(function(r){
        html += '<tr>' + head.map(function(h, idx){
          return '<td>' + mdInline(r[idx] || '') + '</td>';
        }).join('') + '</tr>';
      });
      html += '</tbody></table>';
      continue;
    }

    if (/^---+$/.test(t)){ closeList(); html += '<hr class="md-hr">'; i++; continue; }

    const hm = t.match(/^(#{1,6})\s+(.*)$/);
    if (hm){
      closeList();
      const lv = hm[1].length;
      html += '<h' + lv + ' class="md-h md-h' + lv + '">' + mdInline(hm[2]) + '</h' + lv + '>';
      i++; continue;
    }

    if (t.charAt(0) === '>'){
      closeList();
      html += '<blockquote class="md-quote">' + mdInline(t.replace(/^>\s?/, '')) + '</blockquote>';
      i++; continue;
    }

    const ulm = t.match(/^-\s+(.*)$/);
    const olm = t.match(/^\d+\.\s+(.*)$/);
    if (ulm){
      if (listType !== 'ul'){ closeList(); html += '<ul>'; listType = 'ul'; }
      html += '<li>' + mdInline(ulm[1]) + '</li>';
      i++; continue;
    }
    if (olm){
      if (listType !== 'ol'){ closeList(); html += '<ol>'; listType = 'ol'; }
      html += '<li>' + mdInline(olm[1]) + '</li>';
      i++; continue;
    }

    if (t === ''){ closeList(); i++; continue; }

    closeList();
    html += '<p class="md-p">' + mdInline(t) + '</p>';
    i++;
  }
  closeList();
  if (inCode){ html += '<pre class="md-code">' + esc(codeBuf.join('\n')) + '</pre>'; }
  return html;
}

/* ---------- 神秘卡片 ---------- */
function buildMysteryCard(app){
  const card = document.createElement('article');
  card.className = 'card mystery-card';
  card.dataset.id = app.id;

  card.innerHTML =
    peekHTML(app) +
    '<div class="mystery-body"><span class="big-999">' + esc(app.name) + '</span></div>' +
    '<div class="card-foot mystery-foot">' +
      '<button class="btn btn-primary" type="button" data-act="open">' + ICON_OPEN + '打开</button>' +
    '</div>';

  card.querySelector('[data-act="open"]').addEventListener('click', function(){ openApp(app); });

  let killTimer = null;
  function show(){
    clearTimeout(killTimer);
    card.classList.add('on');
    card.querySelector('.peek').setAttribute('aria-hidden', 'false');
  }
  function hide(){
    card.classList.remove('on');
    card.querySelector('.peek').setAttribute('aria-hidden', 'true');
  }
  card.addEventListener('mouseenter', show);
  card.addEventListener('mouseleave', hide);

  if (window.matchMedia && window.matchMedia('(hover: none)').matches) {
    const body = card.querySelector('.mystery-body');
    body.style.cursor = 'pointer';
    body.addEventListener('click', function(){
      if (card.classList.contains('on')) { hide(); } else { show(); }
    });
  }
  return card;
}

/* ---------- 普通卡片 ---------- */
function buildCard(app){
  if (app.kind === 'js') return buildMysteryCard(app);
  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.id = app.id;

  const glyph = esc(String(app.name || '?').slice(0, 1));
  const kindCls = 'kind ' + (app.kind || 'other');
  const kindTxt = KIND_LABEL[app.kind] || '文件';

  const metaBits = [];
  if (app.size) metaBits.push('<span class="m">' + esc(app.size) + '</span>');
  if (app.date) metaBits.push('<span class="m plain">' + esc(app.date) + '</span>');

  const tags = (app.tags || []).map(function(t){
    return '<span class="tag">' + esc(t) + '</span>';
  }).join('');

  let firstBtn;
  if (app.kind === 'html') {
    firstBtn = '<button class="btn btn-primary" type="button" data-act="open">' + ICON_OPEN + '打开</button>';
  } else if (app.docId || app.docPath) {
    firstBtn = '<button class="btn" type="button" data-act="doc">' + ICON_DOC + '说明</button>';
  } else {
    firstBtn = '<button class="btn" type="button" data-act="open" aria-disabled="true">' + ICON_OPEN + '打开</button>';
  }

  card.innerHTML =
    peekHTML(app) +
    '<div class="card-head">' +
      '<span class="glyph" aria-hidden="true">' + glyph + '</span>' +
      '<span class="' + kindCls + '"><i class="kd"></i>' + kindTxt + '</span>' +
    '</div>' +
    '<h2 class="card-name">' + esc(app.name) + '</h2>' +
    '<p class="card-desc">' + esc(app.desc) + '</p>' +
    '<div class="meta">' + metaBits.join('') + '</div>' +
    '<div class="card-foot">' +
      '<div class="tags">' + tags + '</div>' +
      '<div class="btn-group">' + firstBtn +
        ((app.links && app.links.length)
          ? app.links.map(function(l, i){
              return '<button class="btn" type="button" data-link="' + i + '">' + ICON_DL + esc(l.t) + '</button>';
            }).join('')
          : '<button class="btn" type="button" data-act="download">' + ICON_DL + '拿走</button>') +
      '</div>' +
    '</div>';

  const openEl = card.querySelector('[data-act="open"]');
  if (openEl) openEl.addEventListener('click', function(){ openApp(app); });
  const dlBtn = card.querySelector('[data-act="download"]');
  if (dlBtn) dlBtn.addEventListener('click', function(){ downloadApp(app); });
  Array.prototype.forEach.call(card.querySelectorAll('[data-link]'), function(btn){
    btn.addEventListener('click', function(){
      const l = (app.links || [])[Number(btn.getAttribute('data-link'))];
      if (l) downloadFile(l);
    });
  });
  const docEl = card.querySelector('[data-act="doc"]');
  if (docEl) docEl.addEventListener('click', function(){ openDoc(app); });

  /* ---------- 悬停预览 ---------- */
  const frame = card.querySelector('.peek-frame');
  let built = false;
  let killTimer = null;
  let previewUrl = '';

  function buildPreview(){
    if (built) return;
    built = true;
    if (app.href) {
      if (app.kind === 'html') {
        const iframe = document.createElement('iframe');
        iframe.setAttribute('aria-hidden', 'true');
        iframe.setAttribute('tabindex', '-1');
        iframe.setAttribute('loading', 'lazy');
        iframe.setAttribute('title', app.name + ' 预览');
        iframe.addEventListener('load', function(){ frame.classList.add('ready'); });
        iframe.src = app.href;
        frame.appendChild(iframe);
      } else if (app.docPath) {
        frame.classList.add('ready');
        const box = document.createElement('div');
        box.className = 'md-doc peek-doc';
        box.innerHTML = '<p class="md-p" style="opacity:.55">读取说明中…</p>';
        frame.innerHTML = '';
        frame.appendChild(box);
        fetch(app.docHref, { cache: 'no-store' }).then(function(r){
          if (!r.ok) throw new Error('bad');
          return r.text();
        }).then(function(txt){
          box.innerHTML = renderMarkdown(txt);
        }).catch(function(){
          box.innerHTML = '<p class="md-p">说明没读到，点「说明」在 GitHub 上查看。</p>';
        });
      } else {
        frame.classList.add('ready', 'plain');
        frame.innerHTML = '<span class="peek-mark">' + esc(String(app.name || '?').slice(0, 1)) + '</span>' +
          '<span class="peek-tip">外链文件，点拿走</span>';
      }
      return;
    }

    if (app.kind === 'html' && payloadOf(app.id)) {
      const iframe = document.createElement('iframe');
      iframe.setAttribute('aria-hidden', 'true');
      iframe.setAttribute('tabindex', '-1');
      iframe.setAttribute('title', app.name + ' 预览');
      iframe.addEventListener('load', function(){ frame.classList.add('ready'); });
      /* 用 srcdoc 直接内嵌文档，不依赖 blob: URL——受限的应用内预览器也能渲染 */
      iframe.srcdoc = bytesToText(b64ToBytes(payloadOf(app.id)));
      frame.appendChild(iframe);
    } else if (app.docId && payloadOf(app.docId)) {
      /* 带说明文档的条目：预览直接渲染说明 */
      frame.classList.add('ready');
      const box = document.createElement('div');
      box.className = 'md-doc peek-doc';
      box.innerHTML = renderMarkdown(bytesToText(b64ToBytes(payloadOf(app.docId))));
      frame.innerHTML = '';
      frame.appendChild(box);
    } else {
      frame.classList.add('ready', 'plain');
      frame.innerHTML = '<span class="peek-mark">' + esc(String(app.name || '?').slice(0, 1)) + '</span>' +
        '<span class="peek-tip">' + (payloadOf(app.id) ? '这类文件不能预览' : '还没放进来') + '</span>';
    }
  }

  function show(){
    clearTimeout(killTimer);
    card.classList.add('on');
    card.querySelector('.peek').setAttribute('aria-hidden', 'false');
    buildPreview();
  }

  function hide(){
    card.classList.remove('on');
    card.querySelector('.peek').setAttribute('aria-hidden', 'true');
    clearTimeout(killTimer);
    killTimer = setTimeout(function(){
      if (card.classList.contains('on')) return;
      if (!built) return;
      frame.querySelectorAll('iframe').forEach(function(f){ f.remove(); });
      if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = ''; }
      built = false;
      frame.classList.remove('ready');
      frame.innerHTML = '<span class="peek-sk">生成预览</span>';
    }, 5000);
  }

  card.addEventListener('mouseenter', show);
  card.addEventListener('mouseleave', hide);

  if (window.matchMedia && window.matchMedia('(hover: none)').matches) {
    const head = card.querySelector('.card-head');
    head.style.cursor = 'pointer';
    head.addEventListener('click', function(){
      if (card.classList.contains('on')) { hide(); } else { show(); }
    });
  }

  return card;
}

/* 复制全文：剪贴板 API 快路径，旧环境 execCommand 兜底 */
function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function(resolve, reject){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove();
    if (ok) resolve(); else reject();
  });
}
document.getElementById('codeCopy').addEventListener('click', function(){
  if (!pendingApp) return;
  copyText(codeBox.textContent).then(function(){
    toast('复制好了。');
  }).catch(function(){
    toast('没复制上，长按全选试试。');
  });
});
modal.querySelectorAll('[data-close]').forEach(function(el){
  el.addEventListener('click', closeModal);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !modal.hidden) closeModal();
});

const appModalEl = document.getElementById('appModal');
appModalEl.querySelectorAll('[data-app-close]').forEach(function(el){
  el.addEventListener('click', closeAppModal);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !appModalEl.hidden) closeAppModal();
});

applyView();

</script>
</body>
</html>
